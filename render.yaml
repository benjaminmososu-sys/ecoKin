# Template render.yaml for Render.com deployment (edit placeholders before use)
# More info: https://render.com/docs/render.yaml

services:
  - type: web
    name: eco-kin-backend
    env: python
    branch: main
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: "<SET_IN_RENDER_UI>"
      - key: APP_URL
        value: "https://your-frontend-domain.tld"
      - key: GEMINI_API_KEY
        value: ""
